version: '3.8'

services:
  # This is your Python bot
  bot:
    build: .  # This tells Docker to build from the Dockerfile in this folder
    container_name: discord-verify-bot
    restart: unless-stopped
    # We will add the environment variables in the Portainer UI
    depends_on:
      - redis  # Wait for the redis container to be healthy

  # This is the Redis database
  redis:
    image: redis:7-alpine  # Use a small, efficient Redis image
    container_name: discord-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data  # This makes your data persist if the container restarts

# This creates a private network for our containers
networks:
  npm-network:

# This defines the persistent storage volume
volumes:
  redis-data:
    driver: local